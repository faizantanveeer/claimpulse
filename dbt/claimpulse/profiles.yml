claimpulse:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: claimpulse_transformer
      database: claimpulse_analytics
      warehouse: claimpulse_wh
      schema: stagging
      threads: 4